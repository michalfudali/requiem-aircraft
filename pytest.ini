[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
addopts = --strict-config --strict-markers -ra --durations=15
xfail_strict = true
markers =
    browser: Real Chromium acceptance tests (enable with --browser)
    tier1: Tier 1 Feature Coverage test cases
    tier2: Tier 2 Boundary, Negative and Stability test cases
    tier3: Tier 3 Cross-Feature Combination test cases
    tier4: Tier 4 Real-World Application Scenario test cases
